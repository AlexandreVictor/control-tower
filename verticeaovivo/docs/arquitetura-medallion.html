<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Farol · Arquitetura de dados (medalhão)</title>
  <!--
    diagram-design · type: medallion · inputs YAML
    title: "Projeto Farol · Arquitetura de dados (medalhão)"
    subtitle: "bronze → silver → gold → métrica + IA · catálogo lakehouse_vertice"
    tiers:
      - Bronze (outer) · bucket bronze.raw · regras: só entra pelo job · ninguém altera à mão
      - Silver (default, color #4e6d8a qualidade) · bucket silver.* · regras: 18 tipos de sujeira · UNION das 3 ferramentas
      - Gold (focal) · bucket gold.* · regras: fotografia de hoje · fornecedor lê da silver
      - Métrica + IA (default, color #647535 governança) · bucket gold.mv · ia
    promotions: LIMPAR (0→1) · MODELAR KPI (1→2, focal) · GOVERNAR (2→3)
    paths: PIPELINE PATH · IA PATH
    dark: false
  -->
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
      --soft: #5a6580; --rule: rgba(45,49,66,0.12); --accent: #bf4520;
      --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 852px; }
    .tier-title { fill: var(--ink); font: 600 13px var(--sans); text-anchor: middle; }
    .bucket, .field-value, .example-value { fill: var(--muted); font: 400 9px var(--mono); }
    .bucket { text-anchor: middle; }
    .field-value { color: var(--muted); }
    .silver-text { fill: #4e6d8a; }
    .gov-text { fill: #647535; }
    .focal-text { fill: var(--accent); }
    .field-label { fill: var(--ink); font: 600 11px var(--sans); }
    .example-label, .arc-label, .path-tag { font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .example-label { fill: var(--soft); font-size: 8px; }
    .arc-label { font-size: 10px; text-anchor: middle; }
    .path-title { fill: var(--ink); font: 600 11px var(--sans); }
    .path-sub { fill: var(--muted); font: 400 9px var(--mono); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Projeto Farol · Lakehouse Vértice</p>
    <h1>Arquitetura de dados (medalhão)</h1>

    <svg viewBox="0 0 852 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medallion-vertice-title medallion-vertice-desc">
      <title id="medallion-vertice-title">Arquitetura medallion do Projeto Farol</title>
      <desc id="medallion-vertice-desc">Dados brutos da ingestão passam por bronze, silver e gold e chegam às métricas governadas consumidas por Genie e pelo app minha-torre.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4e6d8a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-olive" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#647535"/></marker>
        <clipPath id="clip-bronze"><rect x="16" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-silver"><rect x="204" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-gold"><rect x="392" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-governa"><rect x="580" y="80" width="172" height="380" rx="6"/></clipPath>
      </defs>
      <rect width="852" height="548" fill="#f5f5f5"/>

      <!-- Promotion arcs draw before the tier cards (z-order rule). -->
      <path d="M102 80 C102 0 290 0 290 80" fill="none" stroke="#4e6d8a" stroke-width="1.4" marker-end="url(#arrow-slate)"/>
      <path d="M290 80 C290 0 478 0 478 80" fill="none" stroke="#bf4520" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <path d="M478 80 C478 0 666 0 666 80" fill="none" stroke="#647535" stroke-width="1.4" marker-end="url(#arrow-olive)"/>
      <text x="196" y="50" class="arc-label" fill="#4e6d8a">LIMPAR</text>
      <text x="384" y="50" class="arc-label" fill="#bf4520">MODELAR KPI</text>
      <text x="572" y="50" class="arc-label" fill="#647535">GOVERNAR</text>

      <!-- Bronze (outer style) -->
      <rect x="16" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="16" y="80" width="172" height="50" fill="rgba(79,93,117,0.10)" clip-path="url(#clip-bronze)"/>
      <rect x="16" y="80" width="172" height="380" rx="6" fill="none" stroke="#4f5d75"/>
      <text x="102" y="106" class="tier-title">Bronze</text>
      <text x="102" y="144" class="bucket">bronze.raw</text>
      <text x="32" y="180" class="field-label">Ferramenta</text>
      <foreignObject x="32" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">read_files · volume bronze.raw</div></foreignObject>
      <text x="32" y="220" class="field-label">Formato</text>
      <foreignObject x="32" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">bruto · como veio da fonte</div></foreignObject>
      <text x="32" y="260" class="field-label">Quem escreve</text>
      <foreignObject x="32" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">job vertice_farol (ingestão)</div></foreignObject>
      <text x="32" y="360" class="example-label">Regras</text>
      <text x="32" y="374" class="example-value">só entra pelo job</text>
      <text x="32" y="388" class="example-value">ninguém altera à mão</text>

      <!-- Silver (color override: qualidade) -->
      <rect x="204" y="80" width="172" height="380" rx="6" fill="rgba(78,109,138,0.07)"/>
      <rect x="204" y="80" width="172" height="50" fill="rgba(78,109,138,0.14)" clip-path="url(#clip-silver)"/>
      <rect x="204" y="80" width="172" height="380" rx="6" fill="none" stroke="#4e6d8a" stroke-width="1.4"/>
      <text x="290" y="106" class="tier-title">Silver</text>
      <text x="290" y="144" class="bucket silver-text">silver.*</text>
      <text x="220" y="180" class="field-label">Ferramenta</text>
      <foreignObject x="220" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Lakeflow SDP · SQL declarativo</div></foreignObject>
      <text x="220" y="220" class="field-label">Formato</text>
      <foreignObject x="220" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">limpo · EXPECT … FAIL UPDATE</div></foreignObject>
      <text x="220" y="260" class="field-label">Quem escreve</text>
      <foreignObject x="220" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">pipeline vertice_medalhao</div></foreignObject>
      <text x="220" y="360" class="example-label">Regras</text>
      <text x="220" y="374" class="example-value silver-text">18 tipos de sujeira</text>
      <text x="220" y="388" class="example-value silver-text">UNION das 3 ferramentas</text>

      <!-- Gold (focal) -->
      <rect x="392" y="80" width="172" height="380" rx="6" fill="rgba(191,69,32,0.07)"/>
      <rect x="392" y="80" width="172" height="50" fill="rgba(191,69,32,0.14)" clip-path="url(#clip-gold)"/>
      <rect x="392" y="80" width="172" height="380" rx="6" fill="none" stroke="#bf4520" stroke-width="1.6"/>
      <text x="478" y="106" class="tier-title">Gold</text>
      <text x="478" y="144" class="bucket focal-text">gold.*</text>
      <text x="408" y="180" class="field-label">Ferramenta</text>
      <foreignObject x="408" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">modelagem dos KPIs</div></foreignObject>
      <text x="408" y="220" class="field-label">Formato</text>
      <foreignObject x="408" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">PV · EV · AC acumulados</div></foreignObject>
      <text x="408" y="260" class="field-label">Quem escreve</text>
      <foreignObject x="408" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">SQL declarativo (src/gold)</div></foreignObject>
      <text x="408" y="360" class="example-label">Regras</text>
      <text x="408" y="374" class="example-value focal-text">fotografia de hoje</text>
      <text x="408" y="388" class="example-value focal-text">fornecedor lê da silver</text>

      <!-- Métrica + IA (color override: governança) -->
      <rect x="580" y="80" width="172" height="380" rx="6" fill="rgba(100,117,53,0.07)"/>
      <rect x="580" y="80" width="172" height="50" fill="rgba(100,117,53,0.14)" clip-path="url(#clip-governa)"/>
      <rect x="580" y="80" width="172" height="380" rx="6" fill="none" stroke="#647535" stroke-width="1.4"/>
      <text x="666" y="106" class="tier-title">Métrica + IA</text>
      <text x="666" y="144" class="bucket gov-text">gold.mv · ia</text>
      <text x="596" y="180" class="field-label">Ferramenta</text>
      <foreignObject x="596" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">metric view YAML · ai_classify</div></foreignObject>
      <text x="596" y="220" class="field-label">Formato</text>
      <foreignObject x="596" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">KPI uma só vez · VARIANT</div></foreignObject>
      <text x="596" y="260" class="field-label">Quem escreve</text>
      <foreignObject x="596" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">metricas_governadas · IA</div></foreignObject>
      <text x="596" y="360" class="example-label">Regras</text>
      <text x="596" y="374" class="example-value gov-text">gold.mv_projetos</text>
      <text x="596" y="388" class="example-value gov-text">gold.status_estruturado</text>

      <!-- Write-method paths -->
      <rect x="16" y="476" width="402" height="56" rx="6" fill="#fff" stroke="rgba(45,49,66,0.20)"/>
      <rect x="24" y="482" width="80" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="64" y="491" class="path-tag" fill="#2d3142" font-size="7" text-anchor="middle">PIPELINE PATH</text>
      <text x="112" y="506" class="path-title">Lakeflow Spark Declarative Pipelines</text>
      <text x="112" y="522" class="path-sub">src/silver + src/gold · um assunto por arquivo</text>
      <rect x="434" y="476" width="402" height="56" rx="6" fill="#fff" stroke="rgba(45,49,66,0.20)"/>
      <rect x="442" y="482" width="56" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="470" y="491" class="path-tag" fill="#2d3142" font-size="7" text-anchor="middle">IA PATH</text>
      <text x="506" y="506" class="path-title">ai_classify + ai_extract</text>
      <text x="506" y="522" class="path-sub">gold.status_estruturado · resultado VARIANT</text>
    </svg>
  </main>
</body>
</html>
